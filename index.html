        state.step = questions.length;

    function calculateResult() {
      const tally = { A: 0, B: 0, C: 0, D: 0, E: 0 };
      state.answers.forEach(key => { if (key) tally[key] += 1; });
      const max = Math.max(...Object.values(tally));
      return priorityOrder.find(key => tally[key] === max) || "C";

    function buildResultCanvas(result) {
      const width = 1080;
      const height = 1920;
      const canvas = document.createElement("canvas");

      canvas.height = height;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#F4F6F0";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#FFFFFF";
      roundRect(ctx, 68, 68, width - 136, height - 136, 30, true);
      ctx.strokeStyle = "rgba(143,168,130,.24)";
      ctx.lineWidth = 3;
      roundRect(ctx, 96, 96, width - 192, height - 192, 24, false);

      drawCentered(ctx, "BE YOUR SUN", 150, 34, "#2E352B", "700", "Noto Serif TC");
      drawCentered(ctx, "WEDDING ATMOSPHERE PROPOSAL", 196, 20, "#8FA882", "700", "Noto Sans TC", .22);
      line(ctx, 456, 238, 624, 238, "rgba(143,168,130,.32)", 2);

      drawCentered(ctx, "撠惇雿?憍旨??", 330, 24, "#8FA882", "700", "Noto Sans TC", .18);
      drawWrappedCentered(ctx, result.title, 390, 780, 58, 1.18, "#2E352B", "900", "Noto Serif TC");

      let y = 565;
      y = drawCardSection(ctx, "?唬犖蝢飛?寡釭 繚 Analysis", result.analysis, y, "#FEFBF3");
      y = drawCardSection(ctx, "撠惇????蝔遣霅?繚 Timeline", result.suggestions.map((item, index) => `${index + 1}. ${item}`).join("\n"), y + 22, "#FFFFFF");
      y = drawCardSection(ctx, "??雿?孵?繚 BE YOUR SUN Value", result.sunnyValue, y + 22, "#FEFBF3");

      line(ctx, 210, 1710, 870, 1710, "rgba(143,168,130,.18)", 2);
      drawCentered(ctx, "霈?蝳桐??芣摰?瘚?嚗鋡急?????湔晷撠?, 1770, 26, "#2E352B", "600", "Noto Serif TC");
      drawCentered(ctx, "IG: @sunny_yeh_wedding  繚  Atmosphere Report", 1832, 20, "rgba(46,53,43,.55)", "400", "Noto Sans TC", .08);
      return canvas;
    }

    function drawCardSection(ctx, title, body, y, bgColor) {
      const x = 128;
      const w = 824;
      const padding = 34;
      const titleHeight = 40;
      const lines = [];
      body.split("\n").forEach(part => lines.push(...wrapText(ctx, part, w - padding * 2, 26, "Noto Sans TC", "400")));
      const h = padding * 2 + titleHeight + lines.length * 40 + 10;

      ctx.fillStyle = bgColor;
      roundRect(ctx, x, y, w, h, 24, true);
      ctx.strokeStyle = "rgba(143,168,130,.13)";
      ctx.lineWidth = 2;
      roundRect(ctx, x, y, w, h, 24, false);

      ctx.fillStyle = "#2E352B";
      ctx.font = `700 28px "Noto Serif TC", serif`;
      ctx.fillText(title, x + padding, y + padding + 26);

      ctx.fillStyle = "rgba(46,53,43,.78)";
      ctx.font = `400 26px "Noto Sans TC", sans-serif`;
      let textY = y + padding + titleHeight + 36;
      lines.forEach(lineText => {
        ctx.fillText(lineText, x + padding, textY);
        textY += 40;
      });
      return y + h;
    }

    async function saveCanvas(canvas, fileName) {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png", 1));
      if (!blob) throw new Error("Canvas blob failed");
      const url = URL.createObjectURL(blob);

      const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: "image/png" })] })) {
        try {
          await navigator.share({ files: [new File([blob], fileName, { type: "image/png" })], title: "BE YOUR SUN 憍旨瘞?閮箸" });
          setTimeout(() => URL.revokeObjectURL(url), 30000);
          return;
        } catch (error) {
          if (error.name !== "AbortError") console.warn(error);
        }
      }

      if (isiOS) {
        window.open(url, "_blank");
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        return;
      }

      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }

    function drawCentered(ctx, text, y, size, color, weight, family, letterSpacing = 0) {
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px "${family}", sans-serif`;
      if (!letterSpacing) {
        ctx.textAlign = "center";
        ctx.fillText(text, 540, y);
        ctx.textAlign = "start";
        return;
      }
      drawTextWithLetterSpacing(ctx, text, 540, y, letterSpacing * size, true);
    }

    function drawWrappedCentered(ctx, text, y, maxWidth, size, lineHeight, color, weight, family) {
      const lines = wrapText(ctx, text, maxWidth, size, family, weight);
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px "${family}", serif`;
      ctx.textAlign = "center";
      lines.forEach((lineText, index) => {
        ctx.fillText(lineText, 540, y + index * size * lineHeight);
      });
      ctx.textAlign = "start";
    }

    function wrapText(ctx, text, maxWidth, size, family, weight) {
      ctx.font = `${weight} ${size}px "${family}", sans-serif`;
      const result = [];
      let lineText = "";
      [...text].forEach(char => {
        const test = lineText + char;
        if (ctx.measureText(test).width > maxWidth && lineText) {
          result.push(lineText);
          lineText = char;
        } else {
          lineText = test;
        }
      });
      if (lineText) result.push(lineText);
      return result;
    }

    function drawTextWithLetterSpacing(ctx, text, centerX, y, spacing, centered) {
      const chars = [...text];
      const total = chars.reduce((sum, char) => sum + ctx.measureText(char).width, 0) + spacing * (chars.length - 1);
      let x = centered ? centerX - total / 2 : centerX;
      chars.forEach(char => {
        ctx.fillText(char, x, y);
        x += ctx.measureText(char).width + spacing;
      });
    }

    function roundRect(ctx, x, y, w, h, r, fill) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      fill ? ctx.fill() : ctx.stroke();
    }

    function line(ctx, x1, y1, x2, y2, color, width) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    render();
  </script>
